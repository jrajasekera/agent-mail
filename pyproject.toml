[project]
name = "amail"
version = "0.1.0"
description = "Presence and messaging for coding agents on one machine"
readme = "README.md"
authors = [
    { name = "Jude Rajasekera", email = "juderajasekera@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
amail = "amail.cli:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
